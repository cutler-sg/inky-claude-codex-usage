[project]
name = "inky-frame"
version = "0.1.0"
description = "SSH-controlled Pimoroni Inky Impression 5.7 photo frame"
requires-python = ">=3.12"
dependencies = ["pillow>=11.1,<13"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.15,<0.16"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["python-library-inky"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
